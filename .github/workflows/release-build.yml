name: release-build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag (for example v2026.09.04.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-build:
    strategy:
      fail-fast: false
      matrix:
        profile: [stable, enhanced]
    runs-on: windows-2022
    name: ${{ matrix.profile }} / Windows x64
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: windows-build-deps-boost-1.87.0-mysql-8.4.9
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and package
        shell: pwsh
        run: ./scripts/ci-build.ps1 -Profile '${{ matrix.profile }}' -BuildType RelWithDebInfo
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-windows
          path: artifacts/${{ matrix.profile }}-*
          if-no-files-found: error

  publish:
    needs: windows-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view '${{ steps.tag.outputs.value }}' >/dev/null 2>&1 || \
            gh release create '${{ steps.tag.outputs.value }}' --title '${{ steps.tag.outputs.value }}' --generate-notes
          gh release upload '${{ steps.tag.outputs.value }}' release-files/* --clobber
