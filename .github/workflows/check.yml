name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository, configuration and SQL
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Run helper self-tests
        shell: pwsh
        run: ./scripts/self-test.ps1
      - name: Validate JSON formatting
        shell: pwsh
        run: |
          Get-Content ./upstreams.lock.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content ./runtime.defaults.json -Raw | ConvertFrom-Json | Out-Null
